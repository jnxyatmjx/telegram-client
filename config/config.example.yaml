# tg-client example configuration (architecture v5 §5.1).
#
# Copy to config.yaml and fill in real values. Values of the form ${VAR} are
# read from the environment — never hardcode or commit secrets.
# Every key below is parsed by src/app/Config.cpp (Config.h holds the
# defaults); anything left out falls back to those defaults.

telegram:
  api_id: 123456            # from https://my.telegram.org — supply via env
  api_hash: "${TG_API_HASH}"
  phone: "${TG_PHONE}"      # user account (not a bot token)
  database_directory: "/data/tdlib/db"    # chmod 700; TDLib database is encrypted
  files_directory: "/data/tdlib/files"
  # NOTE (memory-only downloads): TDLib's downloadFile is the ONLY way to
  # fetch image bytes — a Telegram message carries only file metadata
  # (file_id, size), not bytes — and it always writes the downloaded file
  # here. The client itself never writes a file; it only reads the bytes
  # back into memory (gRPC + Outbox BLOB). To keep downloads off persistent
  # disk, point this at a tmpfs mount (e.g. /dev/shm/tdlib-files): TDLib
  # then writes to RAM and the files vanish on reboot. There is no code
  # change that removes the download step — without it there are no bytes
  # to send or store.
  encryption_key: "${TG_TDLIB_ENCRYPTION_KEY}"
  log_updates: false   # true: log every incoming Telegram update (type + full content) at info level — very verbose

grpc:
  target: "dns:///media.example.com:443"   # real server address pending (user)
  tls: true
  token: "${GRPC_TOKEN}"
  ca_cert: ""   # optional: PEM file with the CA that signed the server cert (private/self-signed CA); empty = system default roots
  # Bidi streams have no per-message deadline; ack timeout used to set the
  # Outbox ack deadline. SUPERSEDED for the ProcessImages send path by
  # outbox.send_grace_ms / outbox.sent_timeout_ms (retry design §3.1) —
  # kept parsed for backward compatibility only, no code reads it.
  ack_timeout_ms: 30000
  reconnect_backoff_ms: 1000   # 1s -> 2s -> 4s ... capped at 30s
  connections: 1   # parallel gRPC connections (lanes); each lane has its own ProcessImages + SearchImages stream, requests round-robin across lanes
  # --- HTTP/2 channel args (chunk 3): applied to every lane's channel, see
  # src/transport/GrpcTransport.cpp MakeChannelArgs(); 0 = keep gRPC default ---
  keepalive_ms: 60000                    # GRPC_ARG_KEEPALIVE_TIME_MS. If the server answers "too_many_pings", RAISE this — never lower it
  keepalive_timeout_ms: 20000            # GRPC_ARG_KEEPALIVE_TIMEOUT_MS: ping unanswered this long = connection dead
  keepalive_permit_without_calls: true   # keep the lane's TCP healthy even with no call in flight
  max_message_bytes: 67108864            # 64 MiB max send AND receive message length — matches the Python client's max_send_message_length; full images must fit
  http2_lookahead_bytes: 1048576         # GRPC_ARG_HTTP2_STREAM_LOOKAHEAD_BYTES (gRPC default 64 KiB): bytes to request ahead per stream
  http2_write_buffer_bytes: 524288       # GRPC_ARG_HTTP2_WRITE_BUFFER_SIZE: per-call write buffer, smooths large sends

features:
  media_thumbnail:
    enabled: true
    max_thumb_bytes: 5242880
    # Memo cipher seed (Python KEYME, Telethon migration Chunk 1): the
    # AES-256-GCM key is SHA256(keyme); the server must run the same KEYME
    # to decrypt the memo. Secret — keep it in the environment only.
    keyme: "${KEYME}"
  bot_command:
    # Trigger mode (a, final): the bot itself sends the command message;
    # verify sender_user_id == command_bot_user_id.
    command_bot_user_id: 123456789   # real value pending (user)
    # Command names are placeholders until the user confirms them.
    process_command: "/process"
    search_command: "/search"
  auto_search:
    # Media posted in an allowlisted chat (photo, video, animation, an
    # image/* document, or a video/mp4 document — a forward counts) starts
    # SearchImages only, never ProcessImages. DISABLED by default. The
    # SearchRsp is sent back as one reply to that message: a numbered
    # hit list, or the "No One Find" line (link preview on).
    #
    # chats entries are either a TDLib dialog id (-100… int64) or a public
    # username. Both forms may be mixed. @name works quoted or unquoted;
    # t.me/name and https://t.me/name links are the same username.
    # t.me/c/<bare id> is the private-channel link and becomes the -100…
    # dialog id. Prefer the block list below (indentation under
    # features.auto_search). A one-line flow list is also accepted:
    #   chats: ["@publicxme", -1003822626821]  # comment
    # Usernames are resolved with searchPublicChat after login.
    # Look for:
    #   auto_search: parsed chats (N): @name, -100…
    #   auto_search: @name -> chat_id <id> (title "...", type channel)
    #   auto_search: effective allowlist (N): <id>, ...
    # If enabled is true and the list parsed empty:
    #   auto_search: enabled but chats list is empty — check indentation/format of features.auto_search.chats
    # A warning means the name was not found, the chat is not a
    # channel/supergroup, or this account is not a member (then updates
    # for that chat never arrive). If nothing is logged, auto_search is
    # disabled or the process has not finished authorization.
    #
    # chat_links overrides the URL base for a hit's cid (groups with no
    # public username, or a private invite). Key: -100 id, bare id, or
    # @name. Value: base URL. Numeric keys apply immediately. @name applies
    # when that public username is known. Otherwise the client uses chathis
    # when the stored URL is http(s), then getChat/getSupergroup for
    # https://t.me/<username>/, then https://t.me/c/<cid>/<mid>.
    enabled: false
    chats:
      - "@publicxme"
      - -1003822626821
    chat_links:
      -1003822626821: "https://t.me/somegroup/"
      "@privategroup": "https://t.me/+AbCdEf/"
    dedup_ttl_seconds: 600     # (oid, id) recent-search dedup TTL
  commands:
    # Control-chat command surface (Telethon migration chunk 2):
    #   /rsme  dialog listing (channels/groups then users, 45-line batches)
    #   /rsor  失效/非法 dialog audit — reports only, NEVER auto-leaves
    #   /xm /xy /ym /who <bare_chat_id>  history backfill from the watermark
    enabled: true
    # TDLib dialog id of the control conversation (0 = commands off).
    control_chat_id: 0
    # Trigger directions: outgoing messages (the account itself types the
    # command, Python model) and/or the bot user below sending in this chat.
    self_commands: true
    rsme_command: "/rsme"
    rsor_command: "/rsor"
    backfill_commands: ["/xm", "/xy", "/ym", "/who"]
    dialog_limit: 1202         # get_dialogs(limit=...) in /rsme
    list_batch_lines: 45       # lines per /rsme reply message
    rsor_report_limit: 50      # max findings per /rsor report
  history_backfill:
    # Engine behind /xm & co: searchChatMessages(photoAndVideo) pages
    # backward from the newest message to the chat's watermark, then feeds
    # each message through the realtime ProcessImages pipeline (oldest
    # first). Watermark resumes from the persisted state; FloodWait pauses
    # the job for retry-after + flood_pad_seconds.
    enabled: true
    page_limit: 60             # Python get_messages(limit=60); TDLib caps 100
    flood_pad_seconds: 1       # Telethon: sleep e.seconds + 1. Also seeds the shared pipeline FloodRetry pad (src/telegram/FloodRetry.h: FileDownloader / MessageSender / BotCommandHandler retries wait retry_after + this pad)
  media_channels:
    # Whitelist chats whose media is forwarded automatically (Python
    # handmedias). OFF by default — the realtime ImageReply chain already
    # drives the pipeline. Chats are BARE ids (same space as chathis.chat_id
    # and the /rsme listing). rpc: "process" (Python main chain) or
    # "search". If the same chat is also in auto_search.chats (and both
    # enabled), auto_search claims the message first.
    enabled: false
    chats: []
    rpc: "process"

outbox:
  db_path: "/data/outbox.sqlite"   # SQLite, WAL mode; retry-only
  # Send grace (retry design §3.1): deadline carried from Put until the
  # write outcome is known — write-ok flips the record to SENT with the
  # sent_timeout_ms deadline, a lost write re-arms it FAILED due-now.
  send_grace_ms: 5000
  # Safety net: a request written but unreplied for this long is requeued
  # (attempts++; dead-letter at outbox.max_attempts). Must exceed the worst
  # legitimate in-flight latency ≈ max_in_flight × per-image time.
  sent_timeout_ms: 600000
  # Flow-control window (retry design §2(c)): max sent-but-unreplied
  # ProcessImages requests. SearchImages bypasses it. 0 = unlimited.
  max_in_flight: 60
  # On each retry sweep (~10s), delete DONE rows older than this (default
  # 24h). Only successful sends are removed; PENDING, SENT, FAILED and
  # DEAD_LETTER stay. 0 purges DONE rows on the next sweep.
  purge_done_after_seconds: 86400

# State persistence (Telethon migration chunk 2, Python chathis):
# every flush_interval_seconds, chats whose watermark advanced within the
# last active_window_seconds are upserted into the local SQLite table
# `chathis` (chat_id, offset_id, chat_url, init_date, init_time, updated_at;
# GMT+8 fields, Python-compatible shape). Startup restores the table into
# memory; D1 replaces the backend later behind the same interface.
chat_state:
  enabled: false
  db_path: "/data/chathis.sqlite"
  flush_interval_seconds: 30
  active_window_seconds: 45

log:
  level: "info"
